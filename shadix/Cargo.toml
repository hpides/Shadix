[package]
name = "shadix"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
no-movdir64b = []  # Fallback for systems without movdir64b support

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
thiserror = "2.0.17"
memmap2 = "0.9.9"
libc = "0.2.177"
tokio = { version = "1.48.0", features = ["full"] }
itertools = "0.14.0"
rand = "0.9.2"
humantime = "2.3.0"
futures = "0.3.31"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
thread_local = "1.1.9"
core_affinity = "0.8"

[profile.release]
lto = "fat"
panic = "abort"

[profile.reldbg]
inherits = "release"
debug = true
lto = "thin"
panic = "unwind"
